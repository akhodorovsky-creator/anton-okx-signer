name: ANTON safety checks
on:
  push:
    branches:
      - main
      - fix/**
      - backup/autonomous-live-trading-*
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify autonomous trading guards
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const source=fs.readFileSync('multi-live.js','utf8');
          const launcher=fs.readFileSync('eur-order-cap-launcher.js','utf8');
          const guards=[
            "const LIVE=process.env.MULTI_SPOT_LIVE==='true';",
            "book.exposureEur+MAX_ORDER>CAP_EUR||book.availableEur<MAX_ORDER",
            "MULTI_COORDINATOR_OWNS_ALL_TRADING",
            "MAX_ORDER=Math.min(20",
            "requested>20",
            "dailyRegime(await btcDailyBars(),btcBook.qty>1e-9)",
            "if(regime.action!=='BUY')",
            "const p=btcBook",
            "BTC_DAILY_REGIME_EXIT",
            "LEGACY_TAKE_PROFIT_5_PERCENT",
            "LEGACY_STOP_LOSS_2_PERCENT",
            "ANTONV2"
          ];
          for(const guard of guards)if(!source.includes(guard))throw Error('MISSING_TRADING_GUARD: '+guard);
          if(/const \{compute\}=require\('\.\/market-strategy'\)|derivativeRows|observeOi\(/.test(source))throw Error('OLD_SHORT_TERM_ENTRY_LOGIC_STILL_ACTIVE');
          if(/SOURCE_PATCH_MISMATCH|_compile\(|vm\.Script|split\(before\)/.test(launcher))throw Error('RUNTIME_PATCHER_STILL_PRESENT');
          NODE
      - run: npm run check
      - run: npm test
      - run: node eur-order-cap-launcher.js --verify
