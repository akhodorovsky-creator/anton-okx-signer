name: ANTON offline research checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check offline-backtest.js
      - run: node --check offline-backtest.test.js
      - run: node --test offline-backtest.test.js
